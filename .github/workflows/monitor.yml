name: binance-equity-funding-alert

on:
  schedule:
    - cron: "*/5 * * * *"   # 每5分钟(高峰期可能延迟, 不保证精确)
  workflow_dispatch:
    inputs:
      test_msg:
        description: '测试消息内容(填了就只发这条消息,不跑监控)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: binance-equity-funding-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE: ${{ secrets.BINANCE_BASE }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TEST_MSG: ${{ inputs.test_msg }}
        run: |
          # 先探路: PushPlus 在 GHA 美区 runner 上到底能不能通
          echo "=== PushPlus 连通性探测 ==="
          curl -sv --max-time 10 https://www.pushplus.plus/send -X POST \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"连通探测\",\"content\":\"from GHA",\"template\":\"html\"}" 2>&1 | head -30
          echo ""
          echo "=== 进入 monitor ==="
          python monitor.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update equity funding state [skip ci]"
            git push
          else
            echo "state.json 无变化, 跳过提交。"
          fi
