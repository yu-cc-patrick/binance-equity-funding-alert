name: binance-equity-funding-alert

on:
  schedule:
    - cron: "*/5 * * * *"   # 每5分钟(高峰期可能延迟, 不保证精确)
  workflow_dispatch:
    inputs:
      test_msg:
        description: '测试消息内容(填了就只发这条消息,不跑监控)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: binance-equity-funding-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE: ${{ secrets.BINANCE_BASE }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TEST_MSG: ${{ inputs.test_msg }}
        run: |
          set +e; echo "=== schedule diag ===" > diag2.txt; date >> diag2.txt
          curl -s --max-time 10 -o /dev/null -w "%{http_code}" "${BINANCE_BASE}/fapi/v1/exchangeInfo" >> diag2.txt; echo " exchangeInfo" >> diag2.txt
          curl -s --max-time 10 -o /dev/null -w "%{http_code}" "${BINANCE_BASE}/fapi/v1/fundingInfo" >> diag2.txt; echo " fundingInfo" >> diag2.txt
          curl -s --max-time 10 -o /dev/null -w "%{http_code}" "${BINANCE_BASE}/fapi/v1/fundingRate?symbol=AAPLUSDT&limit=1" >> diag2.txt; echo " fundingRate" >> diag2.txt
          echo "--- monitor ---" >> diag2.txt
          python monitor.py >> diag2.txt 2>&1; echo "EXIT=$?" >> diag2.txt
          git config user.name diag && git config user.email diag@bot && git add diag2.txt && git commit -m "diag2 [skip ci]" && git push || true

      - name: Check delisting
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE: ${{ secrets.BINANCE_BASE }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python check_delisting.py

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE: ${{ secrets.BINANCE_BASE }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scanner.py

      - name: Persist state
        run: |
          CHANGED=$(git status --porcelain state.json pending_wx.json delist_state.json equity_list.json scanner_state.json 2>/dev/null)
          if [[ -n "$CHANGED" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json pending_wx.json delist_state.json equity_list.json scanner_state.json 2>/dev/null
            git commit -m "chore: update equity funding state [skip ci]"
            git push
          else
            echo "state 文件无变化, 跳过提交。"
          fi
